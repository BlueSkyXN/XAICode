name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Cancel in-progress runs on the same branch/PR to save minutes.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  maintenance:
    name: "maintenance contract"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Validate upstream provenance and clean contract
        run: python3 scripts/xaicode_maintenance.py check-contract

  check:
    name: "check / ${{ matrix.os }}"
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: macos-latest
            target: aarch64-apple-darwin
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - name: Install DotSlash
        run: |
          set -euo pipefail
          DOTSLASH_VERSION="v0.5.9"
          if [ "${{ matrix.os }}" = "macos-latest" ]; then
            DOTSLASH_ASSET="dotslash-macos-arm64.tar.gz"
          else
            DOTSLASH_ASSET="dotslash-linux-musl.x86_64.tar.gz"
          fi
          curl -fsSL "https://github.com/facebook/dotslash/releases/download/${DOTSLASH_VERSION}/${DOTSLASH_ASSET}" -o /tmp/dotslash.tar.gz
          mkdir -p "$HOME/.local/bin"
          tar -xzf /tmp/dotslash.tar.gz -C "$HOME/.local/bin"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          dotslash --version

      - name: Install Rust 1.94.0
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.94.0"
          components: rustfmt, clippy
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: v1-${{ matrix.os }}-${{ matrix.target }}

      - name: cargo check -p xaicode
        run: cargo check -p xaicode

      - name: cargo clippy -p xaicode --no-deps
        run: cargo clippy -p xaicode --no-deps -- -D warnings

      - name: cargo fmt --check
        run: cargo fmt --check --all

  tests:
    name: "tests / ${{ matrix.os }}"
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: macos-latest
            target: aarch64-apple-darwin
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - name: Install DotSlash
        run: |
          set -euo pipefail
          DOTSLASH_VERSION="v0.5.9"
          if [ "${{ matrix.os }}" = "macos-latest" ]; then
            DOTSLASH_ASSET="dotslash-macos-arm64.tar.gz"
          else
            DOTSLASH_ASSET="dotslash-linux-musl.x86_64.tar.gz"
          fi
          curl -fsSL "https://github.com/facebook/dotslash/releases/download/${DOTSLASH_VERSION}/${DOTSLASH_ASSET}" -o /tmp/dotslash.tar.gz
          mkdir -p "$HOME/.local/bin"
          tar -xzf /tmp/dotslash.tar.gz -C "$HOME/.local/bin"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          dotslash --version

      - name: Install Rust 1.94.0
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.94.0"
          components: clippy
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: v1-${{ matrix.os }}-${{ matrix.target }}-tests

      - name: cargo test -p xaicode
        run: cargo test -p xaicode --all-targets

  clean-boundary:
    name: "clean provider boundary / ubuntu"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install DotSlash
        run: |
          set -euo pipefail
          DOTSLASH_VERSION="v0.5.9"
          DOTSLASH_ASSET="dotslash-linux-musl.x86_64.tar.gz"
          curl -fsSL "https://github.com/facebook/dotslash/releases/download/${DOTSLASH_VERSION}/${DOTSLASH_ASSET}" -o /tmp/dotslash.tar.gz
          mkdir -p "$HOME/.local/bin"
          tar -xzf /tmp/dotslash.tar.gz -C "$HOME/.local/bin"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          dotslash --version

      - name: Install Rust 1.94.0
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.94.0"

      - uses: Swatinem/rust-cache@v2
        with:
          key: v1-ubuntu-clean-boundary

      - name: Build xaicode
        run: cargo build -p xaicode --bin xaicode

      - name: Validate clean custom-provider egress and persistence
        env:
          GROK_BINARY: ${{ github.workspace }}/target/debug/xaicode
        run: |
          cargo test -p xai-grok-shell \
            --test test_global_extra_headers_e2e \
            clean_custom_provider -- --ignored

      - name: Validate provider query parameters and environment headers
        run: cargo test -p xai-grok-sampler --test request_query_and_headers
