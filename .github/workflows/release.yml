name: Release

on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:

# Only one release run at a time.
concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  BIN_NAME: xaicode
  COMPAT_BIN_NAME: xai-grok-pager

jobs:
  preflight:
    name: "release contract"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Validate provenance, product version, binaries, and tag
        run: python3 scripts/xaicode_maintenance.py check-contract

  build:
    name: "build / ${{ matrix.target }}"
    needs: preflight
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-apple-darwin
            os: macos-latest
            use-cross: false

          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            use-cross: false

    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust 1.94.0
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.94.0"
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: v1-release-${{ matrix.target }}

      - name: Install DotSlash
        run: |
          set -euo pipefail
          DOTSLASH_VERSION="v0.5.9"
          if [ "${{ matrix.os }}" = "macos-latest" ]; then
            DOTSLASH_ASSET="dotslash-macos-arm64.tar.gz"
          else
            DOTSLASH_ASSET="dotslash-linux-musl.x86_64.tar.gz"
          fi
          curl -fsSL "https://github.com/facebook/dotslash/releases/download/${DOTSLASH_VERSION}/${DOTSLASH_ASSET}" -o /tmp/dotslash.tar.gz
          mkdir -p "$HOME/.local/bin"
          tar -xzf /tmp/dotslash.tar.gz -C "$HOME/.local/bin"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          dotslash --version

      - name: Build xaicode binaries
        run: |
          cargo build -p xaicode --profile release-dist \
            --bin ${{ env.BIN_NAME }} \
            --bin ${{ env.COMPAT_BIN_NAME }}
          ls -la target/release-dist/${{ env.BIN_NAME }}
          ls -la target/release-dist/${{ env.COMPAT_BIN_NAME }}

      - name: Strip distribution binary
        run: |
          set -euo pipefail
          BIN="target/release-dist/${{ env.BIN_NAME }}"
          BEFORE_SIZE=$(wc -c < "$BIN")
          if [ "${{ matrix.os }}" = "ubuntu-latest" ]; then
            strip --strip-all "$BIN"
          elif [ "${{ matrix.os }}" = "macos-latest" ]; then
            strip -S -x "$BIN"
          else
            echo "Unsupported strip platform: ${{ matrix.os }}"; exit 1
          fi
          AFTER_SIZE=$(wc -c < "$BIN")
          test "$AFTER_SIZE" -lt "$BEFORE_SIZE"
          printf 'stripped %s from %s to %s bytes\n' "$BIN" "$BEFORE_SIZE" "$AFTER_SIZE"
          file "$BIN"

      - name: Smoke test xaicode binaries
        run: |
          set -euo pipefail
          BIN="target/release-dist/${{ env.BIN_NAME }}"
          COMPAT_BIN="target/release-dist/${{ env.COMPAT_BIN_NAME }}"
          test -x "$BIN"
          test -x "$COMPAT_BIN"
          "$BIN" --version
          "$BIN" --help >/dev/null
          "$COMPAT_BIN" --version
          "$COMPAT_BIN" --help >/dev/null

      - name: Validate clean custom-provider boundary against release binary
        env:
          GROK_BINARY: ${{ github.workspace }}/target/release-dist/${{ env.BIN_NAME }}
        run: |
          cargo test -p xai-grok-shell \
            --test test_global_extra_headers_e2e \
            clean_custom_provider -- --ignored

      - name: Validate provider query parameters and environment headers
        run: cargo test -p xai-grok-sampler --test request_query_and_headers

      - name: Package artifact
        id: pkg
        run: |
          set -euo pipefail
          BIN="target/release-dist/${{ env.BIN_NAME }}"
          NAME="xaicode-${{ matrix.target }}"
          if [ "${{ matrix.os }}" = "ubuntu-latest" ] && file "$BIN" | grep -q "ELF"; then
            tar -czf "${NAME}.tar.gz" -C target/release-dist ${{ env.BIN_NAME }}
          elif [ "${{ matrix.os }}" = "macos-latest" ] && file "$BIN" | grep -q "Mach-O"; then
            tar -czf "${NAME}.tar.gz" -C target/release-dist ${{ env.BIN_NAME }}
          else
            echo "Unknown binary format:"; file "$BIN"; exit 1
          fi
          echo "artifact=${NAME}.tar.gz" >> "$GITHUB_OUTPUT"

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: xaicode-${{ matrix.target }}
          path: ${{ steps.pkg.outputs.artifact }}

  release:
    name: "draft release"
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v8
        with:
          path: artifacts
          merge-multiple: false

      - name: List artifacts
        run: find artifacts -type f -ls

      - name: Create Release draft
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          draft: true
          generate_release_notes: true
          tag_name: ${{ github.ref_name }}
          files: artifacts/**/*/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
